[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "lojadepaes-gestao"
version = "0.1.0"
description = "Loja de Pães – Gestão: estoque, receitas, produção e custo (app separado da Loja)"
requires-python = ">=3.12"
# Versões fixadas: as mesmas instaladas hoje na Loja de Pães (GESTAO-001, seção 5.2).
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "psycopg[binary]==3.3.5",
  "pyyaml==6.0.3",
  "rapidfuzz==3.14.6",
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "tzdata==2026.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/loja_reader/demanda.py" = ["E501"]
"app/models/*.py" = ["E501"]
# mensagens em português para a pessoa que usa a tela: não vale quebrar a frase no meio
"app/domain/*.py" = ["E501"]
"app/api/v1/*.py" = ["E501"]
"app/cli.py" = ["E501"]
"tests/*.py" = ["E501"]
