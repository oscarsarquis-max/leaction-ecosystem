name: qmind-openapi

on:
  push:
    paths:
      - "qmind/backend/**"
      - ".github/workflows/qmind-openapi.yml"
  pull_request:
    paths:
      - "qmind/backend/**"
      - ".github/workflows/qmind-openapi.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qmind/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: OpenAPI drift + contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/qmind/backend
          DATABASE_URL_ADMIN: postgresql+psycopg://admin:password123@localhost:5433/qmind
          DATABASE_URL_APP: postgresql+psycopg://qmind_app:qmind_app_dev@localhost:5433/qmind
          AUTH_MODE: dev
          ENVIRONMENT: local
          STORAGE_BACKEND: memory
          ALLOW_SIMULATED_SECURITY_PASS: "true"
        run: |
          python scripts/check_openapi_drift.py
          # Contract unit tests that do not require a live DB for schema generation
          pytest -q tests/test_openapi_contract.py -k "not error_body_runtime"
