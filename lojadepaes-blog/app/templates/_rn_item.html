<article class="rn-item">
  <div class="rn-meta">
    <span class="rn-kind rn-kind-{{ item.rn.kind }}">{{ t.kinds[item.rn.kind] }}</span>
    {% if item.rn.is_new %}<span class="rn-new">{{ t.rn_new }}</span>{% endif %}
    <span class="hand when">{{ item.rn.ends or item.when }}</span>
    {% if item.rn.fonte %}<span class="rn-source">{{ item.rn.fonte }}</span>{% endif %}
  </div>
  <h3 class="now-title"><a href="{{ item.path }}">{{ item.titulo }}</a></h3>
  {% if item.resumo %}<p class="now-sub">{{ item.resumo }}</p>{% endif %}
  <div class="rn-actions">
    <a class="rn-cta" href="{{ item.rn.cta_href }}"{% if item.rn.kind == "curiosidade" %} data-share="{{ item.rn.share_text }}"{% endif %}{% if item.rn.cta_external %} target="_blank" rel="noopener"{% endif %}>{{ item.rn.cta_label }}</a>
    <button type="button" class="rn-quero" data-slug="{{ item.slug }}" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>
      <span>{{ t.rn_quero }}</span> <span class="rn-count">{{ item.rn.quero_count }}</span>
    </button>
    <a class="rn-wa" href="{{ item.rn.wa_href }}" target="_blank" rel="noopener" aria-label="{{ t.rn_whatsapp }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.4-4A8 8 0 1 1 8 18.6z"/><path d="M9 9.5c.5 2 2 3.5 4 4l1.2-1.2 2 1-.4 1.4c-3.3.4-7.4-3.7-7-7l1.4-.4 1 2z"/></svg>
    </a>
  </div>
</article>
