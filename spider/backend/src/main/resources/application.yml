server:
  port: 8080

spring:
  application:
    name: spider-orchestrator
  main:
    web-application-type: reactive
  datasource:
    url: jdbc:postgresql://localhost:5432/spider_orchestrator
    username: spider_user
    password: spider_password
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: spider-tech-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

spider:
  http:
    connect-timeout-ms: 2000
    response-timeout-ms: 3000
  adapter:
    mock:
      enabled: true
    bindings:
      mock-ref: binding:mock-universal@1.0
  canonical:
    route:
      max-steps: 8
    execution:
      budget: PT60S
    mapping:
      max-depth: 8
      max-bytes: 65536
    http:
      enabled: false
      status-query-enabled: false
      max-request-bytes: 65536
      max-canonical-data-bytes: 32768
      request-timeout: PT30S
    signal-http:
      enabled: false
      max-request-bytes: 32768
    persistence:
      mode: memory
      result:
        max-bytes: 65536
        ttl: PT24H
      idempotency:
        ttl: PT24H
      startup-inspection:
        enabled: false
  callback:
    reconciliation:
      enabled: false
      batch-size: 25
      lease-duration: PT30S
      max-batch-size: 100
    recovery:
      enabled: false
  security:
    integrity:
      enabled: false
    replay-guard:
      enabled: false
      cleanup-enabled: false
      cleanup-batch-size: 100
    sensitive-fingerprint-v2:
      enabled: false
    mock-key-provider:
      enabled: false
  governance:
    mode: STATIC
    control-plane:
      enabled: false
    scope: DEFAULT
    bootstrap:
      enabled: false
      activate: false
      classpath-resource: ""
      allowed-prefix: governance/bootstrap/
    cache:
      enabled: true
      max-snapshots: 100
    revocation-check:
      enabled: true
    require-distinct-publisher: true
    require-distinct-activator: true
    max-artifact-bytes: 262144
    max-artifacts-per-bundle: 500
    historical-context-cache:
      enabled: true
      max-snapshots: 100
    in-flight-revocation-check:
      enabled: true
    revoked-in-flight-policy: STOP_BEFORE_NEXT_EXTERNAL_EFFECT
  signal:
    ingress:
      durable-application:
        enabled: false
    continuation-token:
      enabled: false
      legacy-lookup-enabled: true
      require-for-durable: true
    envelope-protection:
      enabled: false
      mock-key-provider:
        enabled: false
      max-plaintext-bytes: 262144
      retention-enabled: false
      retention-batch-size: 100
    application:
      batch-size: 25
      lease-duration: PT30S
      max-attempts: 5
      recovery-enabled: false
    max-envelope-bytes: 262144
  originator:
    base-url: http://localhost:8081
    callback-path: /api/callback
  legado:
    base-url: http://localhost:8082
    process-path: /api/legado/processar
  jwt:
    secret: ${SPIDER_JWT_SECRET:change-me-spider-local-dev-secret-key-32b-min}
    issuer: leaction-spider
    ttl-seconds: 300
  console:
    enabled: false
    http:
      enabled: false
    local-demo:
      enabled: false
    max-page-size: 50
    default-page-size: 20
    polling-min-interval: PT1S
    safe-projections:
      enabled: false
  telemetry:
    enabled: false
  operational-health:
    enabled: false
    default-window: PT24H
    max-window: P7D
    allowed-windows: [PT15M, PT1H, PT24H, P7D]
    minimum-sample-size: 20
    max-results: 5000
    aged-wait-threshold: PT5M
  failure-lab:
    enabled: false
    http:
      enabled: false
    local-demo:
      enabled: false
    max-concurrent-runs: 1
    max-executions-per-run: 10
    max-run-duration: PT5M
    evidence:
      enabled: true
  worker-runtime:
    enabled: false
    http:
      enabled: false
    local-demo:
      enabled: false
    instance-id: ""
    heartbeat-interval: PT5S
    stale-after: PT20S
    tick-interval: PT1S
    default-batch-size: 25
    default-lease-duration: PT30S
    default-execution-timeout: PT20S
    max-concurrency: 4
    drain-timeout: PT30S
    max-attempts: 3
    allow-drain: false
    recovery:
      enabled: false

resilience4j:
  circuitbreaker:
    instances:
      legadoFinanceiro:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      legadoFinanceiro:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

logging:
  level:
    root: INFO
    br.com.banco.spider: DEBUG
    org.hibernate.SQL: INFO
    org.springframework.web.reactive.function.client: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level [traceparent=%X{traceparent}] %logger{36} - %msg%n"
