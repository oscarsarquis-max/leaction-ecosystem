server:
  port: 8080

spring:
  application:
    name: spider-orchestrator
  main:
    web-application-type: reactive
  datasource:
    url: jdbc:postgresql://localhost:5432/spider_orchestrator
    username: spider_user
    password: spider_password
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: spider-tech-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

spider:
  http:
    connect-timeout-ms: 2000
    response-timeout-ms: 3000
  originator:
    base-url: http://localhost:8081
    callback-path: /api/callback
  legado:
    base-url: http://localhost:8082
    process-path: /api/legado/processar
  jwt:
    secret: ${SPIDER_JWT_SECRET:change-me-spider-local-dev-secret-key-32b-min}
    issuer: leaction-spider
    ttl-seconds: 300

resilience4j:
  circuitbreaker:
    instances:
      legadoFinanceiro:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      legadoFinanceiro:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

logging:
  level:
    root: INFO
    br.com.banco.spider: DEBUG
    org.hibernate.SQL: INFO
    org.springframework.web.reactive.function.client: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level [traceparent=%X{traceparent}] %logger{36} - %msg%n"
