# Profile sandbox/homologação AWS. Não é local-demo e não é produção.
# Secrets vêm de variáveis / Secrets Manager. Persistência canônica permanece memory
# até existir ferramenta de migration controlada e prova de reinício.
server:
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
  health:
    defaults:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    ping:
      enabled: true
    monitorProjection:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

spider:
  http:
    cors:
      allowed-origins: ${SPIDER_CORS_ORIGINS:https://monitor.spider.actionhub.com.br,https://spider.actionhub.com.br}
  adapter:
    mock:
      enabled: true
  canonical:
    http:
      enabled: true
      status-query-enabled: true
    signal-http:
      enabled: ${SPIDER_CANONICAL_SIGNAL_HTTP_ENABLED:true}
    persistence:
      mode: ${SPIDER_CANONICAL_PERSISTENCE_MODE:memory}
  monitor:
    persistence:
      mode: ${SPIDER_MONITOR_PERSISTENCE_MODE:memory}
      jdbc:
        url: ${SPIDER_MONITOR_JDBC_URL:}
        username: ${SPIDER_MONITOR_JDBC_USERNAME:}
        password: ${SPIDER_MONITOR_JDBC_PASSWORD:}
        max-pool-size: ${SPIDER_MONITOR_JDBC_MAX_POOL_SIZE:5}
        connection-timeout: ${SPIDER_MONITOR_JDBC_CONNECTION_TIMEOUT:10000}
    retention: P90D
    purge:
      enabled: true
      interval: PT1H
  console:
    enabled: true
    http:
      enabled: true
    local-demo:
      enabled: false
    safe-projections:
      enabled: true
    company-scope:
      enabled: true
      bindings:
        "[owner:sandbox]": ${SPIDER_MONITOR_ALLOWED_COMPANIES:}
      canonical-principals: ${SPIDER_MONITOR_CANONICAL_PRINCIPALS:owner:sandbox}
  telemetry:
    enabled: ${SPIDER_TELEMETRY_ENABLED:true}
  callback:
    reconciliation:
      enabled: false
  jwt:
    secret: ${SPIDER_JWT_SECRET}
    issuer: spider-sandbox
  originator:
    base-url: ${SPIDER_ORIGINATOR_BASE_URL:}
  legado:
    base-url: ${SPIDER_LEGADO_BASE_URL:}
  satellite:
    enabled: true
    max-bytes: 8192
    loopback-only: false
    registry:
      actionfinance:
        role: EXPERIENCE
        secret: ${SPIDER_ACTIONFINANCE_APPLICATION_SECRET:}
        credential-aliases:
          - actionfinance
        purposes:
          - FINANCIAL_EXTERNAL_LOOKUP
          - FINANCIAL_EXTERNAL_LIST
        interaction-types:
          - QUERY_STATUS
        classifications:
          - INTERNAL
        governed-context-ids:
          - ACTIONFINANCE_FINANCIAL_LOOKUP_V1
          - ACTIONFINANCE_FINANCIAL_LIST_V1
        declared-context-ids: []
        allowed-objectives:
          - LOOKUP_EXTERNAL_PAYMENT
          - LIST_EXTERNAL_PAYMENTS
        allowed-attributes:
          channel:
            - ACTIONFINANCE_HOMOLOG
          purposeVersion:
            - financial-lookup-v1
            - financial-list-v1
          theme:
            - payment_lookup
            - payment_list
          situation:
            - test_payment_follow_up
            - test_payment_list
          need:
            - lookup_external_payment
            - list_external_payments
          horizon:
            - days
          companyId:
            - 9c2e0a10-4f11-4b8a-9c2e-0a104f11000c
            - 624023a4-57e3-415c-b7d0-925ca1acd3b7
        environment: sandbox
        status: ACTIVE
      lojadepaes:
        role: EXPERIENCE
        secret: ${SPIDER_LOJADEPAES_APPLICATION_SECRET:}
        credential-aliases:
          - lojadepaes
        purposes:
          - LOJA_BIBLIOTECA
        interaction-types:
          - QUERY_STATUS
        classifications:
          - INTERNAL
        governed-context-ids:
          - LOJADEPAES_BIBLIOTECA_V1
        declared-context-ids: []
        allowed-objectives:
          - LIST_LOJA_PLANS
          - GET_LOJA_ENTITLEMENTS
          - LIST_LOJA_SUBSCRIPTIONS
          - START_LOJA_CHECKOUT
          - CANCEL_LOJA_SUBSCRIPTION
          - RESERVE_LOJA_CREDITS
          - CONFIRM_LOJA_CREDITS
          - RELEASE_LOJA_CREDITS
        allowed-attributes:
          channel:
            - LOJADEPAES
          purposeVersion:
            - biblioteca-v1
          theme:
            - biblioteca_plans
          appId:
            - lojadepaes
        environment: sandbox
        status: ACTIVE
        monitor-company-id: 624023a4-57e3-415c-b7d0-925ca1acd3b7
    providers:
      actionhub-pay:
        role: PROVIDER
        status: TEST_DOUBLE
        environment: sandbox
        contract-versions:
          - "1.3"
          - "1.4"
        capabilities:
          - LOOKUP_ACTIONHUB_PAYMENT
          - LIST_PAYMENT_TRANSACTIONS
        base-url: ${SPIDER_ACTIONHUB_PAY_EDGE_URL:https://actionhub.com.br}
        secret: ${SPIDER_ACTIONHUB_PAY_EDGE_SECRET:}
        timeout: PT8S
        company-bindings:
          9c2e0a10-4f11-4b8a-9c2e-0a104f11000c: af-public-test-padaria
          624023a4-57e3-415c-b7d0-925ca1acd3b7: lojadepaes
      actionhub-biblioteca:
        role: PROVIDER
        status: TEST_DOUBLE
        environment: sandbox
        contract-versions:
          - "1.5"
        capabilities:
          - LIST_HUB_CATALOG
          - GET_HUB_ENTITLEMENTS
          - LIST_HUB_SUBSCRIPTIONS
          - START_HUB_CATALOG_CHECKOUT
          - CANCEL_HUB_SUBSCRIPTION
          - RESERVE_HUB_CREDITS
          - CONFIRM_HUB_CREDITS
          - RELEASE_HUB_CREDITS
        base-url: ${SPIDER_ACTIONHUB_BIBLIOTECA_URL:https://actionhub.com.br/hub-api}
        secret: ${SPIDER_ACTIONHUB_BIBLIOTECA_SECRET:}
        timeout: PT8S

logging:
  level:
    root: INFO
    br.com.banco.spider: INFO
    org.hibernate.SQL: WARN
    org.springframework.web.reactive.function.client: WARN
