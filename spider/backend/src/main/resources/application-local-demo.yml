# local-demo — apresentação Mock (PROMPT-015…020 + 020A)
#
# Profile Spring `local-demo` + flags abaixo. Não é produção.
# Ingress canônico: DenyAll permanece no runtime default. Neste profile, a credencial
# allowlist `local-demo-console` (header X-Spider-Credential-Ref) autentica o originador
# `console-local-demo` / canal `operational-console`. Sem header ou credencial estranha → 401.
# Não usar permitAll.
spider:
  context:
    enabled: true
    ui:
      enabled: true
    ai:
      enabled: ${SPIDER_CONTEXT_AI_ENABLED:true}
      provider: ${SPIDER_CONTEXT_AI_PROVIDER:scripted}
      model: ${SPIDER_CONTEXT_AI_MODEL:anthropic.claude-3-5-haiku-20241022-v1:0}
      region: ${AWS_REGION:${AWS_DEFAULT_REGION:us-east-1}}
      scripted-enabled: ${SPIDER_CONTEXT_AI_SCRIPTED_ENABLED:true}
  console:
    enabled: true
    http:
      enabled: true
    local-demo:
      enabled: true
    safe-projections:
      enabled: true
  telemetry:
    enabled: true
  operational-health:
    enabled: true
    minimum-sample-size: 1
  failure-lab:
    enabled: true
    http:
      enabled: true
    local-demo:
      enabled: true
    max-concurrent-runs: 1
    max-executions-per-run: 3
    max-run-duration: PT2M
    evidence:
      enabled: true
  worker-runtime:
    enabled: true
    http:
      enabled: true
    local-demo:
      enabled: true
    heartbeat-interval: PT1S
    stale-after: PT6S
    tick-interval: PT0.5S
    default-batch-size: 10
    default-lease-duration: PT10S
    default-execution-timeout: PT5S
    max-concurrency: 4
    drain-timeout: PT10S
    allow-drain: true
    recovery:
      enabled: true
  capacity:
    enabled: true
    http:
      enabled: true
    local-demo:
      enabled: true
    enforcement:
      enabled: true
  canonical:
    http:
      enabled: true
      status-query-enabled: true
    signal-http:
      enabled: true
    persistence:
      mode: memory
  callback:
    reconciliation:
      enabled: true
  adapter:
    mock:
      enabled: true
  demo:
    contextual-link:
      enabled: true
      gateway-path: /go
      spiderbank-entry-url: http://127.0.0.1:5180/spiderbank
      partner-public-name: CampoAberto
      acquisition:
        allowed-origins:
          - http://127.0.0.1:5180
          - http://localhost:5180
          - http://127.0.0.1:8080
          - http://localhost:8080
        allowed-path-prefixes:
          - /partner/
          - /demo/partner/
        max-bytes: 262144
        timeout: PT3S
    segsense:
      enabled: true
      credential-ref: local-demo-segsense
      application-secret: ${SPIDER_SEGSENSE_DEMO_APPLICATION_SECRET:}
      product-url: ${SPIDER_SEGSENSE_PRODUCT_URL:http://127.0.0.1:5178/demonstracao/mvp-integrado}
      mock-base-url: ${SPIDER_SEGSENSE_MOCK_BASE_URL:http://127.0.0.1:8095}
      mock-credential: ${SPIDER_SEGSENSE_MOCK_CREDENTIAL:}
      timeout: PT3S
      max-bytes: 8192
  satellite:
    enabled: true
    max-bytes: 8192
    loopback-only: true
    registry:
      segsense:
        role: EXPERIENCE
        secret: ${SPIDER_SEGSENSE_DEMO_APPLICATION_SECRET:}
        credential-aliases:
          - local-demo-segsense
        purposes:
          - INSURANCE_PROTECTION_ASSESSMENT
        interaction-types:
          - DECLARE_OBJECTIVE
          - CONTINUE_CONTEXT
          - REQUEST_DECISION
          - QUERY_STATUS
        classifications:
          - PUBLIC
          - INTERNAL
        governed-context-ids:
          - SEGSENSE_FAMILY_CONTINUITY_SYNTHETIC_V1
          - SEGSENSE_INCOME_INTERRUPTION_SYNTHETIC_V1
          - SEGSENSE_NEARBY_FIRES_SYNTHETIC_V1
        declared-context-ids:
          - SEGSENSE_DECLARED_FAMILY_CONTINUITY_V1
          - SEGSENSE_DECLARED_INCOME_INTERRUPTION_V1
          - SEGSENSE_DECLARED_NEARBY_FIRES_V1
          - SEGSENSE_DECLARED_HOME_PROTECTION_V1
          - SEGSENSE_DECLARED_URL_CORRECTION_V1
        allowed-objectives:
          - UNDERSTAND_FAMILY_PROTECTION_OPTIONS
          - UNDERSTAND_PROTECTION_OPTIONS
          - COMPARE_COVERAGE_GAPS
          - SIMULATE_HOME_QUOTE
        allowed-attributes:
          channel:
            - SEGSENSE_PUBLIC_DEMO
          editorialPieceVersion:
            - demo-editorial-v1
            - demo-income-v1
            - demo-fires-v1
          purposeVersion:
            - demo-purpose-v1
          theme:
            - family_continuity
            - income_interruption
            - nearby_fires
            - home_protection
            - crop_production_loss
          situation:
            - dependents_need_continuity
            - income_gap_if_work_stops
            - nearby_fires_hypothetical_region
            - crop_failure_reported
          need:
            - understand_options
            - compare_gaps
            - simulate_home_quote
            - understand_protection_paths
          horizon:
            - years
            - months
          constraint:
            - no_quote
            - unresolved_conflict
            - missing_context
            - editorial_not_risk
            - editorial_not_eligibility
          dwellingType:
            - APARTMENT
            - HOUSE
          coverPeriodMonths:
            - "12"
          ratingRuleVersion:
            - HOME_QUOTE_SYNTHETIC_V1
        environment: local-demo
        status: ACTIVE
      spiderbank:
        role: EXPERIENCE
        secret: ${SPIDER_SPIDERBANK_DEMO_APPLICATION_SECRET:}
        credential-aliases:
          - local-demo-spiderbank
        purposes:
          - WORKING_CAPITAL_ASSESSMENT
        interaction-types:
          - DECLARE_OBJECTIVE
          - CONTINUE_CONTEXT
          - REQUEST_DECISION
          - QUERY_STATUS
        classifications:
          - PUBLIC
          - INTERNAL
        governed-context-ids:
          - SPIDERBANK_WORKING_CAPITAL_SYNTHETIC_V1
        declared-context-ids: []
        allowed-objectives:
          - SEEK_WORKING_CAPITAL
        allowed-attributes:
          channel:
            - SPIDERBANK_PUBLIC_DEMO
          purposeVersion:
            - demo-working-capital-v1
          theme:
            - working_capital
          situation:
            - synthetic_working_capital_need
          need:
            - assess_working_capital
          horizon:
            - months
          constraint:
            - unresolved_conflict
            - missing_context
        environment: local-demo
        status: ACTIVE
    providers:
      insurance-provider-mock:
        role: PROVIDER
        status: TEST_DOUBLE
        environment: local-demo
        contract-versions:
          - "1.0"
          - "1.1"
        capabilities:
          - BUILD_ILLUSTRATIVE_PROTECTION_SCENARIO
          - GET_INSURANCE_OPTIONS
          - GENERATE_SYNTHETIC_HOME_QUOTE
          - DISCOVER_SYNTHETIC_CROP_PROTECTION_PATHS
        base-url: ${SPIDER_SEGSENSE_MOCK_BASE_URL:http://127.0.0.1:8095}
        secret: ${SPIDER_SEGSENSE_MOCK_CREDENTIAL:}
        timeout: PT3S
      credit-provider-mock:
        role: PROVIDER
        status: TEST_DOUBLE
        environment: local-demo
        contract-versions:
          - credit-mock/0.1
          - credit-mock/0.2
        capabilities:
          - GET_CUSTOMER_PROFILE
          - CHECK_CUSTOMER_REGISTRATION
          - GET_CREDIT_PROFILE
          - FIND_ELIGIBLE_PRODUCTS
          - SIMULATE_WORKING_CAPITAL
        base-url: ${SPIDER_CREDIT_MOCK_BASE_URL:http://127.0.0.1:8096}
        secret: ${SPIDER_CREDIT_MOCK_CREDENTIAL:}
        timeout: PT3S
  credit-demo:
    enabled: true
    product-url: ${SPIDER_SPIDERBANK_PRODUCT_URL:http://127.0.0.1:5190/}
    bff-url: ${SPIDER_SPIDERBANK_BFF_URL:http://127.0.0.1:8090/api/health}
    mock-base-url: ${SPIDER_CREDIT_MOCK_BASE_URL:http://127.0.0.1:8096}
    assertion-secret: ${SPIDER_SPIDERBANK_CUSTOMER_ASSERTION_SECRET:}

spring:
  datasource:
    url: jdbc:h2:mem:spider_presentation;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
