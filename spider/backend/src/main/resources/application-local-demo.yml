spider:
  console:
    enabled: true
    http:
      enabled: true
    local-demo:
      enabled: true
    safe-projections:
      enabled: true
  telemetry:
    enabled: true
  operational-health:
    enabled: true
    minimum-sample-size: 1
  failure-lab:
    enabled: true
    http:
      enabled: true
    local-demo:
      enabled: true
    max-concurrent-runs: 1
    max-executions-per-run: 3
    max-run-duration: PT2M
    evidence:
      enabled: true
  worker-runtime:
    enabled: true
    http:
      enabled: true
    local-demo:
      enabled: true
    heartbeat-interval: PT1S
    stale-after: PT6S
    tick-interval: PT0.5S
    default-batch-size: 10
    default-lease-duration: PT10S
    default-execution-timeout: PT5S
    max-concurrency: 4
    drain-timeout: PT10S
    allow-drain: true
    recovery:
      enabled: true
  canonical:
    http:
      enabled: true
      status-query-enabled: true
    persistence:
      mode: memory
  adapter:
    mock:
      enabled: true

spring:
  datasource:
    url: jdbc:h2:mem:spider_presentation;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
