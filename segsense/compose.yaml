services:
  postgres:
    image: postgres:18.6
    container_name: segsense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-segsense}
      POSTGRES_USER: ${POSTGRES_USER:-segsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-segsense_local_dev}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${SEGSENSE_POSTGRES_PORT:-5437}:5432"
    volumes:
      - segsense_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  segsense_pgdata:
