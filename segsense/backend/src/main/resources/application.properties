spring.application.name=segsense-backend
server.port=${SEGSENSE_BACKEND_PORT:8088}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.url=${SEGSENSE_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5437/segsense}
spring.datasource.username=${SEGSENSE_DATASOURCE_USERNAME:segsense}
spring.datasource.password=${SEGSENSE_DATASOURCE_PASSWORD:segsense_local_dev}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=segsense

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=segsense
spring.flyway.create-schemas=true

spring.jackson.time-zone=UTC
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

segsense.app.name=SegSense
segsense.app.version=0.1.0
segsense.satellite.application-id=${SEGSENSE_APPLICATION_ID:SEGSENSE}
segsense.cors.allowed-origin=${SEGSENSE_FRONTEND_ORIGIN:http://127.0.0.1:5178,http://localhost:5178}
segsense.public.base-url=${SEGSENSE_PUBLIC_BASE_URL:http://127.0.0.1:5178}
segsense.link.max-ttl-days=30
segsense.link.absolute-max-ttl-days=90
segsense.context-instance.ttl=PT24H
segsense.demo.governed-source.allowed-ports=${SEGSENSE_DEMO_GOVERNED_PORTS:5178}
segsense.demo.spider.base-url=${SEGSENSE_SPIDER_DEMO_BASE_URL:http://127.0.0.1:8080}
segsense.demo.spider.satellite-id=${SEGSENSE_SPIDER_SATELLITE_ID:segsense}
segsense.demo.spider.credential-ref=${SEGSENSE_SPIDER_DEMO_CREDENTIAL_REF:local-demo-segsense}
segsense.demo.spider.application-secret=${SEGSENSE_SPIDER_DEMO_APPLICATION_SECRET:}

logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.jdbc=WARN
