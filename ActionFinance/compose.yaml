services:
  postgres:
    image: postgres:17.6
    container_name: actionfinance-postgres-17
    restart: unless-stopped
    labels:
      com.actionfinance.project: actionfinance
      com.actionfinance.role: postgres
    ports:
      - "127.0.0.1:${ACTIONFINANCE_POSTGRES_PORT:-5439}:5432"
    environment:
      POSTGRES_DB: actionfinance
      POSTGRES_USER: actionfinance_bootstrap
      POSTGRES_PASSWORD: ${ACTIONFINANCE_BOOTSTRAP_PASSWORD:?bootstrap password missing}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - actionfinance_pgdata_17:/var/lib/postgresql/data
      - ./.local/init:/docker-entrypoint-initdb.d:ro
    networks:
      - actionfinance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actionfinance_bootstrap -d actionfinance"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  actionfinance_pgdata_17:

networks:
  actionfinance:
    name: actionfinance-local
