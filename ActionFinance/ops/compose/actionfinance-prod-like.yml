# Ensaio local isolado. Não é a infraestrutura AWS. Postgres só na rede interna.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: actionfinance
      POSTGRES_PASSWORD: ${ACTIONFINANCE_POSTGRES_BOOTSTRAP_PASSWORD:?set in env file}
    volumes:
      - ./bootstrap-prod-like.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d actionfinance"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [actionfinance-internal]

  app:
    image: ${ACTIONFINANCE_IMAGE:?build locally first}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ACTIONFINANCE_ENV_FILE:-../env.production.example}
    environment:
      ACTIONFINANCE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/actionfinance
      # HTTP local essay. Not the production profile (that profile now refuses HTTP issuer/origin).
      SPRING_PROFILES_ACTIVE: oidc-it
    ports:
      - "127.0.0.1:18091:8091"
    networks: [actionfinance-internal]

networks:
  actionfinance-internal:
    driver: bridge
