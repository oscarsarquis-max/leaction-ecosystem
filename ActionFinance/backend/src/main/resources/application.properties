spring.application.name=actionfinance-backend
server.address=127.0.0.1
server.port=${ACTIONFINANCE_BACKEND_PORT:8091}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.datasource.url=${ACTIONFINANCE_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5439/actionfinance}
spring.datasource.username=${ACTIONFINANCE_RUNTIME_USERNAME:actionfinance_runtime}
spring.datasource.password=${ACTIONFINANCE_RUNTIME_PASSWORD:}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=1

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=actionfinance

spring.flyway.enabled=${ACTIONFINANCE_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=actionfinance
spring.flyway.create-schemas=false
spring.flyway.user=${ACTIONFINANCE_MIGRATOR_USERNAME:actionfinance_migrator}
spring.flyway.password=${ACTIONFINANCE_MIGRATOR_PASSWORD:}

spring.jackson.time-zone=UTC
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.orm.connections.pooling=WARN
logging.level.com.zaxxer.hikari=WARN

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=${ACTIONFINANCE_READINESS_INCLUDE:readinessState,db,flywaySchema}

actionfinance.app.version=0.1.0
actionfinance.demo-auth.enabled=${ACTIONFINANCE_DEMO_AUTH_ENABLED:false}
actionfinance.oidc.enabled=${ACTIONFINANCE_OIDC_ENABLED:false}
actionfinance.public-origin=${ACTIONFINANCE_PUBLIC_ORIGIN:}
actionfinance.session.inactivity-minutes=${ACTIONFINANCE_SESSION_TIMEOUT_MINUTES:30}
actionfinance.session.cookie-secure=${ACTIONFINANCE_SESSION_COOKIE_SECURE:true}
actionfinance.ingress.trust-forwarded-headers=${ACTIONFINANCE_TRUST_FORWARDED_HEADERS:false}
actionfinance.integration.homolog=${ACTIONFINANCE_INTEGRATION_HOMOLOG:false}
actionfinance.integration.receipt-sync-enabled=${ACTIONFINANCE_RECEIPT_SYNC_ENABLED:false}
actionfinance.integration.lookup-stale-after=${ACTIONFINANCE_LOOKUP_STALE_AFTER:PT30S}
server.forward-headers-strategy=${ACTIONFINANCE_FORWARD_HEADERS_STRATEGY:none}
actionfinance.cors.allowed-origins=${ACTIONFINANCE_FRONTEND_ORIGIN:http://127.0.0.1:5179,http://localhost:5179}
spring.session.store-type=none
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.name=AFSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax
