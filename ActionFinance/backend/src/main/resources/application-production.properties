server.address=${ACTIONFINANCE_BIND_ADDRESS:0.0.0.0}
server.port=${ACTIONFINANCE_BACKEND_PORT:8091}
spring.web.resources.add-mappings=true
spring.web.resources.cache.cachecontrol.no-store=true

actionfinance.demo-auth.enabled=false
actionfinance.integration.homolog=false
actionfinance.integration.receipt-sync-enabled=${ACTIONFINANCE_RECEIPT_SYNC_ENABLED:false}
actionfinance.integration.spider-base-url=${ACTIONFINANCE_SPIDER_BASE_URL:}
actionfinance.integration.spider-secret=${ACTIONFINANCE_SPIDER_SECRET:}
actionfinance.integration.satellite-id=actionfinance
actionfinance.integration.spider-monitor-base-url=${ACTIONFINANCE_SPIDER_MONITOR_BASE_URL:}
actionfinance.integration.sync-page-limit=${ACTIONFINANCE_SYNC_PAGE_LIMIT:25}
actionfinance.integration.sync-stale-after=${ACTIONFINANCE_SYNC_STALE_AFTER:PT60S}
actionfinance.oidc.enabled=true
actionfinance.public-origin=${ACTIONFINANCE_PUBLIC_ORIGIN}
actionfinance.oidc.issuer=${ACTIONFINANCE_OIDC_ISSUER}
actionfinance.oidc.client-id=${ACTIONFINANCE_OIDC_CLIENT_ID}
actionfinance.oidc.client-secret=${ACTIONFINANCE_OIDC_CLIENT_SECRET}
actionfinance.oidc.redirect-uri=${ACTIONFINANCE_OIDC_REDIRECT_URI}
actionfinance.cors.allowed-origins=${ACTIONFINANCE_PUBLIC_ORIGIN}
actionfinance.session.cookie-secure=true
actionfinance.ingress.trust-forwarded-headers=false

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=actionfinance.SPRING_SESSION
spring.session.timeout=${ACTIONFINANCE_SESSION_TIMEOUT_MINUTES:30}m
server.servlet.session.timeout=${ACTIONFINANCE_SESSION_TIMEOUT_MINUTES:30}m
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=none

spring.security.oauth2.client.registration.actionfinance.provider=actionfinance
spring.security.oauth2.client.registration.actionfinance.client-id=${ACTIONFINANCE_OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.actionfinance.client-secret=${ACTIONFINANCE_OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.actionfinance.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.actionfinance.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.actionfinance.scope=openid,profile
spring.security.oauth2.client.registration.actionfinance.redirect-uri=${ACTIONFINANCE_OIDC_REDIRECT_URI}
spring.security.oauth2.client.provider.actionfinance.issuer-uri=${ACTIONFINANCE_OIDC_ISSUER}

logging.level.org.springframework.security=INFO
logging.level.org.springframework.session=INFO
