server {
    listen 80;
    server_name school.inove4us.com.br school.actionhub.com.br;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name school.inove4us.com.br;
    ssl_certificate     /etc/letsencrypt/live/school.inove4us.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.inove4us.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:5012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Legado: quem abrir actionhub vai para o canônico inove4us
server {
    listen 443 ssl;
    http2 on;
    server_name school.actionhub.com.br;
    ssl_certificate     /etc/letsencrypt/live/school.actionhub.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.actionhub.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://school.inove4us.com.br$request_uri;
}