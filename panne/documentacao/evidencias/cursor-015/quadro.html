<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Panne — quadro de produção</title>
    <style>
      :root { --bege:#e5e4d6; --grafite:#323334; --linha:#c8c7b8; --atencao:#8a5a12; --info:#2f4a5d; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bege); color:var(--grafite); font-family:"Segoe UI",sans-serif; }
      header { display:flex; align-items:center; gap:1rem; min-height:3.25rem; padding:0 .8rem; background:var(--grafite); color:var(--bege); }
      nav a { color:var(--bege); text-decoration:none; margin-right:.8rem; border-bottom:2px solid var(--bege); padding:.5rem 0; }
      main { padding:.85rem 1rem; }
      .filters { display:flex; gap:.5rem; padding:.5rem; background:#f3f2ea; border:1px solid var(--linha); margin-bottom:.7rem; }
      table { width:100%; border-collapse:collapse; background:#f3f2ea; }
      th,td { border-bottom:1px solid var(--linha); padding:.45rem; text-align:left; }
      .badge { border:1px solid var(--linha); padding:0 .35rem; }
    </style>
  </head>
  <body>
    <header>
      <strong>Panne</strong>
      <nav aria-label="Principal">
        <a href="#">Produção</a>
        <a href="#">Planejamento</a>
        <a href="#">Ordens</a>
        <a href="#">Rastreabilidade</a>
      </nav>
      <span>Padaria Central</span>
    </header>
    <main>
      <h1>Quadro de produção</h1>
      <form class="filters">
        <label>Data <input type="date" value="2026-08-22" /></label>
        <label>Turno <select><option>Manhã</option></select></label>
        <label>Área/estação <input /></label>
      </form>
      <table>
        <thead>
          <tr><th>Produto</th><th>Ordem</th><th>Alvo</th><th>Estado</th><th>Etapa</th><th>Próxima ação</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>Pão tradicional</td>
            <td>OP-2026-0001 · B1</td>
            <td>12.000 g</td>
            <td><span class="badge">Em execução</span> <span class="badge">Atrasada</span></td>
            <td>Fermentação</td>
            <td>Concluir etapa</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
