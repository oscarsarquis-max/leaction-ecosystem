[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "panne"
version = "0.1.0"
description = "Fundação da aplicação Panne"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "PyJWT[crypto]>=2.9",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
  "psycopg[binary]>=3.2",
]
bedrock = [
  "boto3>=1.35",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/0019_reporting_analytics.py" = ["E501"]
"alembic/versions/0020_inventory_procurement.py" = ["E501"]
"app/modules/reporting_analytics/**" = ["E501"]
"app/modules/reporting_http/**" = ["E501"]
"app/modules/inventory_procurement/**" = ["E501"]
"app/modules/inventory_http/**" = ["E501"]
"tests/test_reporting_analytics.py" = ["E501"]
"tests/test_inventory_procurement.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
