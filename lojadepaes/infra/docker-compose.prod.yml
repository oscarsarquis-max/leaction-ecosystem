# Stack de produção da Loja de Pães (Lightsail isolado).
# Segredos em /opt/lojadepaes/secrets/app.env — nunca no Git.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${LOJADEPAES_API_IMAGE:-lojadepaes:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /opt/lojadepaes/secrets/app.env
    environment:
      LOJADEPAES_ENV: production
      LOJADEPAES_HTTP_HOST: 0.0.0.0
      LOJADEPAES_SPA_DIR: /app/frontend/dist
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lojadepaes
      POSTGRES_USER: lojadepaes
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lojadepaes -d lojadepaes"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

secrets:
  db_password:
    file: /opt/lojadepaes/secrets/db_password

volumes:
  pgdata:
  caddy_data:
  caddy_config:
