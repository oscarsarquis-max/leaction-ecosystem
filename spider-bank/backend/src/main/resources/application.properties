spring.application.name=spiderbank-backend
server.port=${SPIDERBANK_BACKEND_PORT:8090}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.jackson.time-zone=UTC

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

spiderbank.app.name=SpiderBank
spiderbank.app.version=0.1.0
spiderbank.environment=MOCK_ONLY
spiderbank.infrastructure=SIMULATED_INFRASTRUCTURE
spiderbank.cors.allowed-origin=${SPIDERBANK_FRONTEND_ORIGIN:http://127.0.0.1:5190,http://localhost:5190}
spiderbank.spider.base-url=${SPIDERBANK_SPIDER_DEMO_BASE_URL:http://127.0.0.1:8080}
spiderbank.spider.satellite-id=${SPIDERBANK_SPIDER_SATELLITE_ID:spiderbank}
spiderbank.spider.application-secret=${SPIDERBANK_SPIDER_DEMO_APPLICATION_SECRET:}
spiderbank.spider.connect-timeout=${SPIDERBANK_SPIDER_CONNECT_TIMEOUT:PT2S}
spiderbank.spider.read-timeout=${SPIDERBANK_SPIDER_READ_TIMEOUT:PT5S}
spiderbank.spider.max-bytes=${SPIDERBANK_SPIDER_MAX_BYTES:8192}
spiderbank.customer-assertion.secret=${SPIDERBANK_CUSTOMER_ASSERTION_SECRET:}

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n
logging.level.br.com.spiderbank=INFO
